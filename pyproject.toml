[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdg2pdf-linux"
version = "1.0.1"
description = "Native Linux PDG book converter with CLI and GTK3 GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
    "img2pdf>=0.6",
    "pikepdf>=9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pdg2pdf = "pdg2pdf.cli:main"
pdg2pdf-gui = "pdg2pdf.gui:run_gui"

[tool.setuptools.packages.find]
include = ["pdg2pdf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
